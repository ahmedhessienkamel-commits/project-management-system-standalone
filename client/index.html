<!doctype html>
<html lang="ar" dir="rtl">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Meta Ads Command Center</title>    
    <!-- THIS IS THE START OF A COMMENT BLOCK, BLOCK TO BE DELETED: Google Fonts here, example:
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    THIS IS THE END OF A COMMENT BLOCK, BLOCK TO BE DELETED -->
  </head>

  <body>
    <div id="root">
      <main aria-live="polite" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;font-family:Arial,sans-serif;color:#18324b">
        <section style="width:min(420px,100%);padding:36px 28px;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 18px 45px rgba(15,23,42,.08)">
          <div class="erp-loading-spin" style="width:42px;height:42px;margin:0 auto 18px;border:4px solid #dbeafe;border-top-color:#18324b;border-radius:50%;animation:erp-loading-spin .8s linear infinite"></div>
          <h1 style="margin:0;font-size:20px">جاري تحميل نظام إدارة المشاريع</h1>
          <p style="margin:10px 0 0;color:#64748b;font-size:14px">يرجى الانتظار لحظات حتى تفتح الصفحة.</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
    <style>@keyframes erp-loading-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.erp-loading-spin{animation:none}}</style>
  </body>

</html>
